<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBB00" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF9900" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFBB00" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#FFBB00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="ambience" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFBB00" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#FF9900" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#141414" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient audio glow -->
  <circle cx="650" cy="550" r="450" fill="url(#ambience)" />

  <!-- Acoustic frequency grid -->
  <g opacity="0.18">
    <circle cx="600" cy="600" r="150" stroke="#FFBB00" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="600" cy="600" r="280" stroke="#FFBB00" stroke-width="1.5" stroke-dasharray="6 12" />
    <circle cx="600" cy="600" r="420" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 10" />
    <circle cx="600" cy="600" r="540" stroke="#FFBB00" stroke-width="1" stroke-dasharray="8 16" />
    <line x1="100" y1="600" x2="1100" y2="600" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="600" y1="100" x2="600" y2="1100" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Dynamic Sinusoidal Soundwaves -->
  <path d="M150,750 C300,500 450,900 600,620 C750,340 900,800 1050,550" fill="none" stroke="url(#waveGrad1)" stroke-width="8" filter="url(#glow)" />
  <path d="M120,700 C280,480 440,860 620,600 C800,340 960,780 1100,520" fill="none" stroke="#FFBB00" stroke-width="2.5" opacity="0.8" />
  <path d="M180,780 C320,530 470,920 610,640 C750,360 890,820 1030,570" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  
  <path d="M100,580 C260,350 420,800 580,480 C740,160 900,700 1100,400" fill="none" stroke="url(#waveGrad2)" stroke-width="4" opacity="0.5" />
  <path d="M100,580 C260,350 420,800 580,480 C740,160 900,700 1100,400 L1100,1050 L100,1050 Z" fill="url(#waveGrad1)" opacity="0.25" />

  <!-- Audio Spectrum Frequency Pins -->
  <g opacity="0.85">
    <circle cx="370" cy="620" r="6" fill="#FFBB00" filter="url(#glow)" />
    <line x1="370" y1="620" x2="370" y2="700" stroke="#FFBB00" stroke-width="1.5" stroke-dasharray="2 4" />
    <text x="382" y="625" fill="#FFBB00" font-family="'Urbanist', sans-serif" font-size="14" font-weight="600" letter-spacing="1">100 Hz / +4dB</text>

    <circle cx="620" cy="600" r="7" fill="#ffffff" filter="url(#glow)" />
    <line x1="620" y1="600" x2="620" y2="720" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 4" />
    <text x="632" y="605" fill="#ffffff" font-family="'Urbanist', sans-serif" font-size="14" font-weight="600" letter-spacing="1">1.2 kHz / 0dB</text>

    <circle cx="830" cy="460" r="8" fill="#FFBB00" filter="url(#glow)" />
    <line x1="830" y1="460" x2="830" y2="680" stroke="#FFBB00" stroke-width="1.5" stroke-dasharray="2 4" />
    <text x="842" y="465" fill="#FFBB00" font-family="'Urbanist', sans-serif" font-size="14" font-weight="700" letter-spacing="1">12 kHz / AIR BAND</text>
  </g>
</svg>
